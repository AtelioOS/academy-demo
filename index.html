<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Summit Financial — Agency OS · Academy Demo</title>
<meta name="description" content="Adaptive agent-training platform for a life insurance agency — a module on the Agency OS. Built by Forma on the Atelio backbone." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =============================================================
   Agency OS — Academy Demo · Design Tokens (neutral / placeholder)
   Premium fintech-trust palette: Ink navy · Signal gold · Emerald
   Built by Forma · demo backbone: Atelio
   ============================================================= */
:root{
  /* Core — Ink (warm near-black · LTD signature) */
  --ink:#191307; --ink-2:#241C0E; --ink-3:#332816; --ink-soft:#42341F;
  /* Accent — Bronze / champagne gold (LTD #9F7D55) */
  --gold:#9F7D55; --gold-light:#C6A97E; --gold-deep:#7A5E3C; --gold-tint:#F1E9DA;
  /* Secondary — Muted evergreen (data / adaptive) */
  --sky:#5E7A6E; --sky-light:#8AA598; --sky-tint:#E9EFEB;
  /* Surfaces (warm ivory) */
  --page:#F5F1E8; --surface:#FFFFFF; --surface-2:#FAF6EE; --sidebar:#15100A;
  --sidebar-2:#0C0805; --hover:#F3ECDF; --tint:#EFE7D8;
  /* Text (warm charcoal) */
  --tx:#231C12; --tx-2:#6E6150; --tx-3:#9E9483; --on-dark:#F2EADB; --on-dark-2:#B9A98C;
  /* Borders */
  --bd:#E8DFCC; --bd-strong:#D9CCB1; --bd-dark:#352A1A;
  /* Semantic */
  --ok:#4C7A5E; --ok-soft:#E5EDE6; --warn:#B8863A; --warn-soft:#F4E9D0;
  --bad:#B0524B; --bad-soft:#F1E1DE; --info:#5E7A6E; --info-soft:#E9EFEB;
  /* Radii */
  --r-xs:.3rem; --r-sm:.45rem; --r-md:.6rem; --r-lg:.85rem; --r-xl:1.15rem; --r-pill:999px;
  /* Shadow (warm-tinted) */
  --sh-sm:0 1px 2px rgba(30,22,10,.06),0 1px 3px rgba(30,22,10,.05);
  --sh-md:0 4px 14px rgba(30,22,10,.09),0 2px 6px rgba(30,22,10,.06);
  --sh-lg:0 20px 48px rgba(30,22,10,.20),0 6px 16px rgba(30,22,10,.10);
  /* Type */
  --f-display:'Cormorant Garamond','Junge',Georgia,serif;
  --f-sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-sans); background:var(--page); color:var(--tx);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
::selection{background:var(--gold-tint)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.01em}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
.muted{color:var(--tx-2)} .mute3{color:var(--tx-3)}
.mono{font-family:var(--f-mono)}

/* ---------- App layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}
/* ---------- Sidebar ---------- */
.side{background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-2) 100%);color:var(--on-dark);display:flex;flex-direction:column;overflow-y:auto}
.side::-webkit-scrollbar{width:0}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--bd-dark)}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(214,155,63,.35)}
.brand .logo svg{width:22px;height:22px}
.brand .bt{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.01em;color:#fff;line-height:1.05}
.brand .bs{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2);font-weight:600;margin-top:2px}
.navgroup{padding:14px 12px 4px}
.navgroup .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2);font-weight:700;padding:0 10px 8px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);color:var(--on-dark-2);font-weight:500;font-size:13.5px;position:relative;transition:background .15s,color .15s;margin-bottom:2px}
.nav-i svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-i:hover{background:rgba(255,255,255,.05);color:var(--on-dark)}
.nav-i.active{background:rgba(214,155,63,.14);color:#fff}
.nav-i.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-i.active svg{opacity:1;color:var(--gold-light)}
.nav-i .tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:var(--r-pill);text-transform:uppercase}
.tag.live{background:var(--ok);color:#fff}
.tag.soon{background:rgba(255,255,255,.09);color:var(--on-dark-2)}
.side-foot{margin-top:auto;padding:14px 18px 18px;border-top:1px solid var(--bd-dark);font-size:11px;color:var(--on-dark-2)}
.side-foot b{color:var(--on-dark);font-weight:600}
.side-foot .pw{display:flex;align-items:center;gap:7px;margin-top:3px}
.side-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- Main ---------- */
.main{overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--bd);padding:13px 30px;display:flex;align-items:center;gap:16px}
.topbar .crumb{font-size:13px;color:var(--tx-2)}
.topbar .crumb b{color:var(--tx);font-weight:600}
.topbar .search{margin-left:8px;flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--tint);border:1px solid transparent;border-radius:var(--r-pill);padding:7px 14px;color:var(--tx-3);font-size:13px}
.topbar .search svg{width:15px;height:15px}
.topbar .actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tx-2);background:var(--surface);border:1px solid var(--bd)}
.icon-btn:hover{background:var(--hover);color:var(--tx)}
.icon-btn svg{width:17px;height:17px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ink-3),var(--ink));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.view{padding:30px 34px 60px;max-width:1240px;margin:0 auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
.ph p{color:var(--tx-2);margin-top:5px;font-size:14px;max-width:560px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:var(--r-md);transition:all .15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--ink);color:#fff;box-shadow:var(--sh-sm)}
.btn-primary:hover{background:var(--ink-2);box-shadow:var(--sh-md)}
.btn-gold{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);color:#fff;box-shadow:0 3px 10px rgba(214,155,63,.3)}
.btn-gold:hover{filter:brightness(1.05);box-shadow:0 6px 16px rgba(214,155,63,.4)}
.btn-ghost{background:var(--surface);color:var(--tx);border:1px solid var(--bd)}
.btn-ghost:hover{background:var(--hover);border-color:var(--bd-strong)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.card-pad{padding:22px}
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)} .g-3{grid-template-columns:repeat(3,1fr)} .g-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1080px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}

/* stat tile */
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.stat .sl{font-size:12.5px;color:var(--tx-2);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .sl svg{width:15px;height:15px;color:var(--gold-deep)}
.stat .sv{font-family:var(--f-display);font-weight:600;font-size:30px;color:var(--ink);margin-top:8px;letter-spacing:-.02em}
.stat .sd{font-size:12px;margin-top:5px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.stat .spark{position:absolute;right:14px;bottom:12px;opacity:.5}

/* pills / badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);letter-spacing:.02em}
.b-ok{background:var(--ok-soft);color:#1d7a4e} .b-warn{background:var(--warn-soft);color:var(--gold-deep)}
.b-info{background:var(--info-soft);color:#2c5f8a} .b-bad{background:var(--bad-soft);color:#b23e3e}
.b-neutral{background:var(--tint);color:var(--tx-2)}
.b-lvl{padding:3px 9px}
.lvl-1{background:var(--sky-tint);color:#2c5f8a}
.lvl-2{background:var(--warn-soft);color:var(--gold-deep)}
.lvl-3{background:#efe7f8;color:#6b45a8}

/* progress */
.bar{height:8px;background:var(--tint);border-radius:var(--r-pill);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.bar.thin{height:5px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-size:12px;font-weight:700;color:var(--ink)}

/* ---------- Module rail (dashboard launcher) ---------- */
.launch{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:980px){.launch{grid-template-columns:repeat(2,1fr)}}
.app-tile{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);transition:transform .16s,box-shadow .16s,border-color .16s;position:relative;text-align:left}
.app-tile:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--bd-strong)}
.app-tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.app-tile .ic svg{width:22px;height:22px;color:#fff}
.app-tile h3{font-size:15.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.app-tile p{font-size:12.5px;color:var(--tx-2);margin-top:5px;line-height:1.45}
.app-tile .st{position:absolute;top:16px;right:16px}

/* ---------- Academy: course layout ---------- */
.player-wrap{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
@media(max-width:1000px){.player-wrap{grid-template-columns:1fr}}
.video{background:var(--ink);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md);position:relative;aspect-ratio:16/9}
.video .poster{position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,#1E3350 0%,#0B1727 70%);display:grid;place-items:center}
.video .concept-lbl{position:absolute;top:16px;left:18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);background:rgba(0,0,0,.35);padding:5px 11px;border-radius:var(--r-pill);backdrop-filter:blur(4px)}
.video .ttl{position:absolute;left:22px;bottom:56px;right:22px;color:#fff;font-family:var(--f-display);font-size:24px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.play-btn{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .16s,background .16s}
.play-btn:hover{transform:scale(1.06);background:rgba(255,255,255,.24)}
.play-btn svg{width:30px;height:30px;color:#fff;margin-left:4px}
.vbar{position:absolute;left:0;right:0;bottom:0;padding:0 0 0}
.vbar .segments{display:flex;gap:3px;padding:0 14px 10px}
.seg{flex:1;height:5px;border-radius:var(--r-pill);background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer;position:relative}
.seg>span{display:block;height:100%;width:0;background:var(--gold-light);border-radius:var(--r-pill)}
.seg.done>span{width:100%}
.seg .qz{position:absolute;right:-2px;top:-4px;width:9px;height:9px}
.vctrl{display:flex;align-items:center;gap:14px;padding:2px 16px 12px;color:#fff}
.vctrl svg{width:18px;height:18px}
.vctrl .tc{font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.vctrl .sp{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:var(--r-sm)}

/* chapters sidebar */
.chapters{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden}
.ch-head{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ch-head .t{font-weight:700;font-size:14px;color:var(--ink)}
.ch-list{max-height:520px;overflow-y:auto}
.ch{border-bottom:1px solid var(--bd)}
.ch-t{padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;color:var(--ink);background:var(--surface-2)}
.ch-t .cx{width:22px;height:22px;border-radius:6px;background:var(--tint);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tx-2);flex:none}
.concept{padding:9px 18px 9px 26px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx-2);cursor:pointer;transition:background .13s;border-left:3px solid transparent}
.concept:hover{background:var(--hover)}
.concept.active{background:var(--gold-tint);border-left-color:var(--gold);color:var(--ink);font-weight:600}
.concept .ci{width:18px;height:18px;flex:none;color:var(--tx-3)}
.concept.done .ci{color:var(--ok)}
.concept.locked{opacity:.5;cursor:default}
.concept .dur{margin-left:auto;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.concept .qflag{font-size:9.5px;font-weight:700;color:var(--gold-deep);background:var(--gold-tint);padding:1px 5px;border-radius:4px}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-md);overflow:hidden;margin-top:22px}
.quiz-head{background:linear-gradient(120deg,var(--ink) 0%,var(--ink-3) 100%);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px}
.quiz-head .qic{width:36px;height:36px;border-radius:9px;background:rgba(214,155,63,.2);display:grid;place-items:center}
.quiz-head .qic svg{width:19px;height:19px;color:var(--gold-light)}
.quiz-head h3{font-size:16px;font-weight:700}
.quiz-head p{font-size:12px;color:var(--on-dark-2);margin-top:2px}
.quiz-body{padding:24px}
.q{margin-bottom:22px}
.q .qq{font-weight:600;font-size:15px;color:var(--ink);margin-bottom:12px;display:flex;gap:9px}
.q .qn{color:var(--gold-deep);font-weight:800}
.opt{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1.5px solid var(--bd);border-radius:var(--r-md);margin-bottom:9px;cursor:pointer;transition:all .13s;font-size:13.5px}
.opt:hover{border-color:var(--gold-light);background:var(--surface-2)}
.opt .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd-strong);flex:none;display:grid;place-items:center;transition:all .13s}
.opt .mk svg{width:12px;height:12px;color:#fff;opacity:0}
.opt.sel{border-color:var(--gold);background:var(--gold-tint)}
.opt.sel .mk{border-color:var(--gold);background:var(--gold)}
.opt.sel .mk svg{opacity:1}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mk{border-color:var(--ok);background:var(--ok)}
.opt.correct .mk svg{opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{border-color:var(--bad);background:var(--bad)}
.opt.locked{pointer-events:none}
.explain{font-size:13px;color:var(--tx-2);background:var(--sky-tint);border-left:3px solid var(--sky);padding:11px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:6px;display:none}
.explain.show{display:block;animation:fade .3s}
.explain b{color:var(--ink)}
.quiz-foot{border-top:1px solid var(--bd);padding:16px 24px;display:flex;align-items:center;gap:14px;background:var(--surface-2)}

/* result banner */
.result{display:none;padding:22px 24px;border-radius:var(--r-md);margin-top:4px;align-items:center;gap:16px}
.result.show{display:flex;animation:fade .35s}
.result.pass{background:var(--ok-soft)} .result.retry{background:var(--warn-soft)}
.result .rc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.result.pass .rc{background:var(--ok)} .result.retry .rc{background:var(--gold)}
.result .rc svg{width:24px;height:24px;color:#fff}
.result h4{font-size:16px;color:var(--ink);font-weight:700}
.result p{font-size:13px;color:var(--tx-2);margin-top:2px}

/* ---------- Adaptive ---------- */
.adapt-hero{color:#fff;border-radius:var(--r-xl);padding:30px 34px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--ink),var(--ink-3))}
.adapt-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(214,155,63,.25),transparent 70%)}
.persona-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.ptab{display:flex;align-items:center;gap:11px;padding:12px 16px;border:1.5px solid var(--bd);border-radius:var(--r-lg);background:var(--surface);transition:all .15s;text-align:left}
.ptab:hover{border-color:var(--bd-strong);box-shadow:var(--sh-sm)}
.ptab.active{border-color:var(--gold);background:var(--gold-tint);box-shadow:var(--sh-sm)}
.ptab .pa{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.ptab .pn{font-weight:700;font-size:14px;color:var(--ink)}
.ptab .pm{font-size:11.5px;color:var(--tx-2)}
.path{position:relative;padding-left:20px}
.path::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--bd)}
.pnode{position:relative;padding:14px 0 14px 20px;display:flex;gap:14px;align-items:flex-start}
.pnode::before{content:"";position:absolute;left:-17px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--bd-strong)}
.pnode.on::before{border-color:var(--gold);background:var(--gold)}
.pnode.skip::before{border-color:var(--bd);background:var(--bd)}
.pnode .pcard{flex:1;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-sm)}
.pnode.skip .pcard{opacity:.55;background:var(--surface-2);box-shadow:none}
.pnode.on .pcard{border-color:var(--gold-light)}
.pnode .pt{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pnode .pd{font-size:12.5px;color:var(--tx-2);margin-top:4px}
.rationale{background:var(--sky-tint);border:1px solid #cfe1f0;border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:#2c5f8a;display:flex;gap:11px}
.rationale svg{width:18px;height:18px;flex:none;margin-top:1px}

/* ---------- Admin auto-chunk ---------- */
.upzone{border:2px dashed var(--bd-strong);border-radius:var(--r-lg);padding:40px;text-align:center;background:var(--surface-2);transition:all .2s}
.upzone .uic{width:60px;height:60px;border-radius:16px;background:var(--gold-tint);display:grid;place-items:center;margin:0 auto 16px}
.upzone .uic svg{width:28px;height:28px;color:var(--gold-deep)}
.pipe{display:flex;align-items:center;gap:0;margin:26px 0}
.pstep{flex:1;text-align:center;position:relative}
.pstep .pdot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--bd);display:grid;place-items:center;margin:0 auto 8px;transition:all .3s;color:var(--tx-3);position:relative;z-index:2}
.pstep .pdot svg{width:18px;height:18px}
.pstep.done .pdot{border-color:var(--ok);background:var(--ok);color:#fff}
.pstep.active .pdot{border-color:var(--gold);background:var(--gold);color:#fff;box-shadow:0 0 0 5px var(--gold-tint)}
.pstep .plbl{font-size:11.5px;font-weight:600;color:var(--tx-2)}
.pstep.active .plbl,.pstep.done .plbl{color:var(--ink)}
.pstep::after{content:"";position:absolute;top:20px;left:50%;width:100%;height:2px;background:var(--bd);z-index:1}
.pstep:last-child::after{display:none}
.pstep.done::after{background:var(--ok)}
.chunk-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--bd);border-radius:var(--r-md);margin-bottom:9px;background:var(--surface);animation:slideIn .4s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.chunk-row .cnum{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.chunk-row .cbody{flex:1}
.chunk-row .ct{font-weight:600;font-size:13.5px;color:var(--ink)}
.chunk-row .cm{font-size:11.5px;color:var(--tx-2);margin-top:2px;display:flex;gap:12px}
.chunk-row .cm span{display:flex;align-items:center;gap:4px}
.chunk-row .cm svg{width:12px;height:12px}

/* ---------- Analytics ---------- */
.funnel-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.funnel-row .fl{width:180px;font-size:13px;font-weight:600;color:var(--ink);flex:none}
.funnel-row .ft{flex:1;height:34px;border-radius:var(--r-sm);background:var(--tint);overflow:hidden;position:relative}
.funnel-row .ft>span{display:block;height:100%;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--sky-light),var(--sky));display:flex;align-items:center;padding-left:12px;color:#fff;font-size:12px;font-weight:700}
.funnel-row .fn{width:110px;text-align:right;font-size:12.5px;color:var(--tx-2);flex:none}
.lead-table{width:100%;border-collapse:collapse}
.lead-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--bd)}
.lead-table td{padding:12px 14px;border-bottom:1px solid var(--bd);font-size:13.5px}
.lead-table tr:last-child td{border-bottom:none}
.lead-table tr:hover td{background:var(--surface-2)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}
.rank-1{background:var(--gold);color:#fff} .rank-2{background:#C6CCD6;color:#fff} .rank-3{background:#D9A57A;color:#fff}
.rank-x{background:var(--tint);color:var(--tx-2)}
.person{display:flex;align-items:center;gap:10px}
.pav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.stuck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.stuck:last-child{border-bottom:none}
.stuck .sw{flex:1}
.stuck .sbar{height:7px;border-radius:var(--r-pill);background:var(--tint);margin-top:6px;overflow:hidden}
.stuck .sbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--bad))}

/* spine diagram */
.spine{background:linear-gradient(135deg,#0F1E33,#1E3350);border-radius:var(--r-xl);padding:32px;color:#fff;position:relative;overflow:hidden}
.spine-flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:22px}
.snode{flex:1;min-width:140px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:16px;position:relative}
.snode .si{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.snode .si svg{width:18px;height:18px;color:#fff}
.snode h4{font-size:13.5px;font-weight:700}
.snode p{font-size:11.5px;color:var(--on-dark-2);margin-top:4px;line-height:1.4}
.sarrow{display:grid;place-items:center;padding:0 4px;color:var(--gold-light)}
.sarrow svg{width:20px;height:20px}
@media(max-width:900px){.sarrow{transform:rotate(90deg);padding:6px 0}.snode{min-width:100%}}

/* scaffold / coming-soon */
.scaffold{text-align:center;padding:50px 30px;max-width:620px;margin:20px auto}
.scaffold .sic{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;margin:0 auto 20px;box-shadow:var(--sh-md)}
.scaffold .sic svg{width:36px;height:36px;color:#fff}
.scaffold h2{font-family:var(--f-display);font-size:26px;color:var(--ink);font-weight:600}
.scaffold p{color:var(--tx-2);margin:10px auto 22px;font-size:14px}
.feat-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:8px}
.feat{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px 16px}
.feat svg{width:17px;height:17px;color:var(--ok);flex:none;margin-top:2px}
.feat b{font-size:13.5px;color:var(--ink);font-weight:600}
.feat p{font-size:12px;color:var(--tx-2);margin:3px 0 0}

.section-t{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--ink);margin:6px 0 16px;letter-spacing:-.01em}
.flex{display:flex} .between{justify-content:space-between} .center{align-items:center} .wrap{flex-wrap:wrap}
.gap-s{gap:8px}.gap{gap:14px}.gap-l{gap:22px} .mt{margin-top:18px}.mt-l{margin-top:30px}.mb{margin-bottom:18px}
.hr{height:1px;background:var(--bd);margin:22px 0;border:none}
.chip{font-size:12px;font-weight:600;color:var(--tx-2);background:var(--tint);padding:5px 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:var(--r-pill);box-shadow:var(--sh-lg);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;transition:all .3s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--gold-light)}
.demo-note{background:var(--gold-tint);border:1px solid #ecdcb8;border-radius:var(--r-md);padding:11px 16px;font-size:12.5px;color:var(--gold-deep);display:flex;gap:9px;align-items:flex-start;margin-bottom:22px}
.demo-note svg{width:16px;height:16px;flex:none;margin-top:1px}
.demo-note b{color:#7a5615}

/* ---------- serif tuning for Cormorant ---------- */
.ph h1{font-size:34px;font-weight:600}
.serif{font-weight:600}

/* ---------- profile segmented toggle ---------- */
.seg-toggle{display:inline-flex;background:var(--tint);border:1px solid var(--bd);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg-btn{padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--tx-2);transition:all .16s;white-space:nowrap;display:flex;align-items:center;gap:7px}
.seg-btn svg{width:15px;height:15px}
.seg-btn:hover{color:var(--tx)}
.seg-btn.on{background:var(--ink);color:#fff;box-shadow:var(--sh-sm)}
.seg-btn.on svg{color:var(--gold-light)}

/* ---------- hero band ---------- */
.hero{background:radial-gradient(130% 150% at 50% -30%,#33271400 0%,#15100A 65%),linear-gradient(160deg,#2A2114 0%,#15100A 55%,#100C07 100%);border:1px solid var(--bd-dark);border-radius:var(--r-xl);padding:34px 30px 30px;color:var(--on-dark);position:relative;overflow:hidden;text-align:center;box-shadow:var(--sh-md)}
.hero .frame{position:absolute;inset:14px;border:1px solid rgba(198,169,126,.22);border-radius:calc(var(--r-xl) - 8px);pointer-events:none}
.hero .wm{position:absolute;font-family:var(--f-display);font-weight:600;font-size:280px;color:rgba(198,169,126,.05);top:50%;left:50%;transform:translate(-50%,-46%);line-height:1;pointer-events:none;letter-spacing:.05em}
.hero .he-eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light);position:relative}
.hero .he-mark{font-family:var(--f-display);font-weight:600;font-size:42px;color:#fff;letter-spacing:.02em;line-height:1;margin-top:8px;position:relative}
.hero .he-rule{width:46px;height:1px;background:var(--gold);margin:16px auto 0;opacity:.7}
.hero .he-quote{font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.4;color:var(--gold-light);max-width:640px;margin:16px auto 0;min-height:58px;position:relative;transition:opacity .5s ease}
.hero .he-author{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-2);margin-top:10px;font-weight:600;position:relative;transition:opacity .5s ease}
.hero .he-pill{position:absolute;top:26px;display:inline-flex;align-items:center;gap:8px;background:rgba(198,169,126,.12);border:1px solid rgba(198,169,126,.25);border-radius:var(--r-pill);padding:7px 13px;font-size:12px;font-weight:600;color:var(--gold-light)}
.hero .he-pill svg{width:14px;height:14px}
.hero .he-pill.left{left:26px} .hero .he-pill.right{right:26px}
.hero .he-pill b{color:#fff;font-family:var(--f-display);font-size:15px;font-weight:600}
@media(max-width:760px){.hero .he-pill{display:none}.hero .he-mark{font-size:32px}}

/* ---------- dashboard stat with chart ---------- */
.dstat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px 20px 14px;box-shadow:var(--sh-sm);position:relative}
.dstat .sl{font-size:12px;color:var(--tx-2);font-weight:600;display:flex;align-items:center;gap:7px}
.dstat .sl svg{width:15px;height:15px;color:var(--gold-deep)}
.dstat .sv{font-family:var(--f-display);font-weight:600;font-size:30px;color:var(--ink);margin-top:6px;letter-spacing:-.01em;line-height:1}
.dstat .srow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.dstat .sd{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:3px}
.dstat .sd svg{width:12px;height:12px}
.mo-note{font-size:11px;color:var(--tx-3);font-weight:600;margin-top:2px}

/* ---------- New Associates: stage stepper ---------- */
.assoc-row{padding:16px 20px;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-sm);margin-bottom:12px}
.assoc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.assoc-top .who{flex:1}
.assoc-top .who b{font-size:14.5px;color:var(--ink)}
.assoc-top .who .up{font-size:12px;color:var(--tx-2);margin-top:1px}
.stage-track{display:flex;align-items:flex-start}
.stg{flex:1;text-align:center;position:relative}
.stg .sd2{width:28px;height:28px;border-radius:50%;margin:0 auto;display:grid;place-items:center;border:2px solid var(--bd-strong);background:var(--surface);color:var(--tx-3);z-index:2;position:relative}
.stg .sd2 svg{width:15px;height:15px}
.stg.done .sd2{background:var(--ok);border-color:var(--ok);color:#fff}
.stg.cur .sd2{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px var(--gold-tint)}
.stg .sl2{font-size:10.5px;margin-top:6px;color:var(--tx-2);font-weight:600;line-height:1.25}
.stg.done .sl2,.stg.cur .sl2{color:var(--ink)}
.stg::after{content:"";position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--bd);z-index:1}
.stg:last-child::after{display:none}
.stg.done::after{background:var(--ok)}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ck{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx)}
.ck .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd-strong);flex:none;display:grid;place-items:center}
.ck.on .cb{background:var(--ok);border-color:var(--ok)}
.ck.on .cb svg{width:12px;height:12px;color:#fff}
.ck.on{color:var(--tx-2)}

/* ---------- Wall of Fame ---------- */
.wof-hero{background:radial-gradient(130% 150% at 50% -30%,#33271400 0%,#15100A 65%),linear-gradient(160deg,#2A2114,#15100A);border:1px solid var(--bd-dark);border-radius:var(--r-xl);padding:30px;text-align:center;color:var(--on-dark);position:relative;overflow:hidden;box-shadow:var(--sh-md)}
.tier{margin-bottom:22px}
.tier-h{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.tier-h .tr{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.tier-h .tr svg{width:20px;height:20px}
.tier-h h3{font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:600}
.tier-h .tsub{font-size:12px;color:var(--tx-2)}
.honor{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hcard{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-sm)}
.hcard .pav{width:42px;height:42px;font-size:14px}
.hcard b{font-size:13.5px;color:var(--ink);display:block}
.hcard .rk{font-size:11.5px;color:var(--tx-2)}
.promo{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surface-2);margin-bottom:9px}
.promo .pi{width:34px;height:34px;border-radius:9px;background:var(--gold-tint);display:grid;place-items:center;flex:none;color:var(--gold-deep)}
/* rank ladder */
.rung{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--bd)}
.rung:last-child{border-bottom:none}
.rung .rn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:11px;color:#fff}
.rung.here{background:var(--gold-tint);border-radius:var(--r-md);padding:11px 12px;margin:0 -12px}

/* ---------- Vault ---------- */
.res-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surface);margin-bottom:9px;box-shadow:var(--sh-sm);transition:border-color .13s,box-shadow .13s}
.res-row:hover{border-color:var(--bd-strong);box-shadow:var(--sh-md)}
.res-row .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.res-row .ri svg{width:19px;height:19px}
.res-row .rt{font-weight:600;font-size:13.5px;color:var(--ink)}
.res-row .rm{font-size:11.5px;color:var(--tx-2);display:flex;gap:12px;margin-top:2px;flex-wrap:wrap}

/* ---------- Events ---------- */
.countdown{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(140deg,var(--ink),var(--ink-3));color:#fff;border-radius:var(--r-xl);padding:26px 30px;box-shadow:var(--sh-md);flex-wrap:wrap}
.count-num{font-family:var(--f-display);font-size:52px;color:var(--gold-light);line-height:1}
.ev-row{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px;box-shadow:var(--sh-sm)}
.ev-date{width:58px;text-align:center;flex:none;border-right:1px solid var(--bd);padding-right:14px}
.ev-date .d{font-family:var(--f-display);font-size:24px;color:var(--ink);line-height:1;font-weight:600}
.ev-date .mo{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-deep);font-weight:700;margin-top:2px}
.ev-body{flex:1}
.ev-body .et{font-weight:600;font-size:14px;color:var(--ink)}
.ev-body .em{font-size:12px;color:var(--tx-2);display:flex;gap:12px;margin-top:2px;flex-wrap:wrap}
.ev-body .em svg{width:12px;height:12px}

/* ---------- phase banner (Growth modules) ---------- */
.phase-banner{display:flex;align-items:center;gap:10px;background:var(--gold-tint);border:1px solid #ecdcb8;border-radius:var(--r-md);padding:11px 16px;font-size:13px;color:var(--gold-deep);margin-bottom:22px}
.phase-banner svg{width:16px;height:16px;flex:none}
.phase-banner b{color:#7a5615}
/* Recruiting kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:960px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{background:var(--surface-2);border:1px solid var(--bd);border-radius:var(--r-lg);padding:12px}
.kcol .kh{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.kcol .kh .kn{background:var(--tint);border-radius:var(--r-pill);font-size:11px;padding:1px 8px;color:var(--tx-2);font-weight:700}
.kcard{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:11px 12px;box-shadow:var(--sh-sm);margin-bottom:9px}
.kcard:last-child{margin-bottom:0}
.kcard .kn2{font-weight:600;font-size:13px;color:var(--ink)}
.kcard .km{font-size:11.5px;color:var(--tx-2);margin-top:2px}
.kcard .ktag{font-size:10px;font-weight:700;color:var(--gold-deep);background:var(--gold-tint);padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;margin-top:7px}
.kcard .ktag svg{width:10px;height:10px}
.seq{position:relative;padding-left:22px}
.seq::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--bd)}
.seqi{position:relative;padding:9px 0 9px 14px}
.seqi::before{content:"";position:absolute;left:-19px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.seqi .st{font-weight:600;font-size:13px;color:var(--ink)}
.seqi .sm{font-size:12px;color:var(--tx-2)}
.seqi .sd3{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep)}
/* AI Social */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.posts{grid-template-columns:1fr}}
.post{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.post .pimg{height:118px;display:grid;place-items:center;color:#fff;position:relative}
.post .pimg .plat{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.28);padding:3px 9px;border-radius:var(--r-pill);backdrop-filter:blur(3px)}
.post .pimg svg{width:34px;height:34px;opacity:.9}
.post .pb2{padding:13px 15px}
.post .pcap{font-size:12.5px;color:var(--tx);line-height:1.45}
.post .pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.post .pmeta .when{font-size:11.5px;color:var(--tx-3)}
.budget-bar{height:10px;border-radius:var(--r-pill);background:var(--tint);overflow:hidden;margin-top:8px}
.budget-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold-light),var(--gold-deep))}

/* ---------- Flashcards ---------- */
.deck-chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.dchip{font-size:12.5px;font-weight:600;color:var(--tx-2);background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-pill);padding:8px 15px;cursor:pointer;transition:all .14s}
.dchip:hover{border-color:var(--bd-strong)}
.dchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dchip .cnt{opacity:.6;font-weight:700;margin-left:5px}
.fc-wrap{max-width:640px;margin:0 auto}
.fc{perspective:1800px;height:310px;cursor:pointer;margin-bottom:18px}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r-xl);border:1px solid var(--bd);box-shadow:var(--sh-md);display:grid;place-items:center;padding:36px;text-align:center}
.fc-front{background:var(--surface)}
.fc-front .fe{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-deep);position:absolute;top:22px;left:0;right:0}
.fc-front .q{font-family:var(--f-display);font-weight:600;font-size:28px;color:var(--ink);line-height:1.25}
.fc-front .hint{position:absolute;bottom:18px;left:0;right:0;font-size:12px;color:var(--tx-3)}
.fc-back{background:linear-gradient(135deg,var(--ink),var(--ink-3));color:var(--on-dark);transform:rotateY(180deg)}
.fc-back .fe{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-light);position:absolute;top:22px;left:0;right:0}
.fc-back .a{font-size:16.5px;line-height:1.55;max-width:470px}
.fc-back .a b{color:#fff}
.fc-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.fc-nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--surface);display:grid;place-items:center;color:var(--tx-2);box-shadow:var(--sh-sm)}
.fc-nav:hover{background:var(--hover);color:var(--tx)}
.fc-nav svg{width:18px;height:18px}
.fc-count{font-size:13px;font-weight:600;color:var(--tx-2);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.fc-judge{display:flex;gap:12px;justify-content:center;margin-top:14px}
.fc-known{text-align:center;margin-top:16px;font-size:13px;color:var(--tx-2)}
.fc-known b{color:var(--ok)}

/* ---------- Study Buddy ---------- */
.chat-wrap{max-width:780px;margin:0 auto}
.chat-hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--ink),var(--ink-3));color:#fff;border-radius:var(--r-lg);padding:18px 22px;margin-bottom:18px}
.chat-hero .ci{width:46px;height:46px;border-radius:12px;background:rgba(198,169,126,.18);border:1px solid rgba(198,169,126,.3);display:grid;place-items:center;flex:none}
.chat-hero .ci svg{width:24px;height:24px;color:var(--gold-light)}
.chat-hero h3{font-family:var(--f-display);font-size:20px}
.chat-hero p{color:var(--on-dark-2);font-size:12.5px;margin-top:2px}
.chat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);height:460px;overflow-y:auto;padding:22px}
.msg{display:flex;gap:11px;margin-bottom:16px;max-width:84%}
.msg .mav{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.msg .mav svg{width:17px;height:17px}
.msg .bub{padding:12px 15px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.user .bub{background:var(--ink);color:var(--on-dark);border-bottom-right-radius:4px}
.msg.user .mav{background:var(--ink-3)}
.msg.bot .bub{background:var(--surface-2);border:1px solid var(--bd);color:var(--tx);border-bottom-left-radius:4px}
.msg.bot .mav{background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
.bub b{color:var(--ink)} .msg.user .bub b{color:#fff}
.src-chip{font-size:11px;color:var(--gold-deep);background:var(--gold-tint);padding:3px 9px;border-radius:var(--r-pill);display:inline-flex;gap:5px;align-items:center;margin-top:9px;font-weight:600}
.src-chip svg{width:11px;height:11px}
.chat-input{display:flex;gap:10px;margin-top:14px}
.chat-input input{flex:1;border:1px solid var(--bd-strong);border-radius:var(--r-pill);padding:12px 18px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--tx)}
.chat-input input:focus{outline:none;border-color:var(--gold)}
.chat-input button{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;display:grid;place-items:center;flex:none}
.chat-input button svg{width:18px;height:18px}
.sugg{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.sugg .s{font-size:12.5px;font-weight:600;color:var(--tx);background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-pill);padding:8px 14px;cursor:pointer;transition:all .14s}
.sugg .s:hover{border-color:var(--gold);background:var(--gold-tint)}

/* ---------- Field Training Challenge ---------- */
.chal{background:linear-gradient(135deg,var(--ink),var(--ink-3));color:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 28px}
.chal .ch-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.chal h3{font-family:var(--f-display);font-size:23px;color:#fff}
.chal .csub{color:var(--on-dark-2);font-size:13px;margin-top:7px;max-width:540px;line-height:1.5}
.chal .cprog{text-align:right;flex:none}
.chal .cnum{font-family:var(--f-display);font-size:38px;color:var(--gold-light);line-height:1}
.chal .cdays{font-size:12px;color:var(--on-dark-2);margin-top:3px}
.chal .cbar{width:210px;height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.15);overflow:hidden;margin-top:11px;margin-left:auto}
.chal .cbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold-light),var(--gold))}
.chal-body{background:var(--surface);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--r-xl) var(--r-xl);padding:6px 24px 16px;box-shadow:var(--sh-sm)}
.frun{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--bd)}
.frun:last-child{border-bottom:none}
.frun .fnum{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;margin-top:1px}
.frun .fnum svg{width:15px;height:15px}
.frun .fnum.done{background:var(--ok);color:#fff}
.frun .fnum.booked{background:var(--gold);color:#fff}
.frun .fnum.invite{background:var(--tint);color:var(--tx-2)}
.frun .fnum.empty{background:var(--surface);border:2px dashed var(--bd-strong);color:var(--tx-3)}
.frun .fbody{flex:1}
.frun .ft{font-weight:600;font-size:14px;color:var(--ink)}
.frun .fnote{font-size:12.5px;color:#5a4a2f;background:var(--gold-tint);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:8px;line-height:1.5}
.frun .fnote b{color:#7a5615}
</style>
</head>

/* ---------- CHART HELPERS ---------- */
function spark(series,color,w,h){color=color||'var(--gold)';w=w||96;h=h||34;
  const mn=Math.min(...series),mx=Math.max(...series),rng=(mx-mn)||1;
  const pts=series.map((v,i)=>[i/(series.length-1)*w, h-4-((v-mn)/rng)*(h-8)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area='0,'+h+' '+line+' '+w+','+h;
  const last=pts[pts.length-1];
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="overflow:visible;display:block"><polyline points="'+area+'" fill="'+color+'" opacity=".10"/><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.8" fill="'+color+'"/></svg>';
}
function barChart(data,unit,h){h=h||156;unit=unit||'';
  const mx=Math.max(...data.map(d=>d.v))||1;
  return '<div style="display:flex;align-items:flex-end;gap:8px;height:'+h+'px;padding-top:12px">'+
    data.map((d,i)=>{const bh=Math.max(5,(d.v/mx)*(h-40));const last=i===data.length-1;
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">'+
        '<div style="font-size:11px;font-weight:700;color:'+(last?'var(--gold-deep)':'var(--tx-3)')+';margin-bottom:5px">'+d.v+unit+'</div>'+
        '<div style="width:64%;max-width:36px;height:'+bh+'px;border-radius:5px 5px 0 0;background:'+(last?'linear-gradient(180deg,var(--gold-light),var(--gold))':'var(--tint)')+';border:1px solid '+(last?'transparent':'var(--bd)')+'"></div>'+
        '<div style="font-size:10.5px;color:var(--tx-3);margin-top:7px;font-weight:600">'+d.m+'</div></div>';}).join('')+'</div>';
}
function dstat(k){
  const arrow=k.inv?'down':'up';
  return '<div class="dstat"><div class="sl">'+svg(k.ic,15)+' '+k.l+'</div>'+
    '<div class="srow"><div><div class="sv">'+k.v+'</div><div class="sd up">'+svg('up',12)+' '+k.d+'</div></div>'+
    '<div style="flex:none">'+spark(k.series)+'</div></div>'+
    '<div class="mo-note">'+k.note+'</div></div>';
}

const CRUMB={dashboard:['Dashboard',''],learn:['Academy','· Course Player'],flashcards:['Academy','· Flashcards'],studybuddy:['Academy','· Study Buddy'],adaptive:['Academy','· Adaptive Paths'],admin:['Academy','· Content Studio'],analytics:['Academy','· Analytics'],associates:['New Associates','· Team LTD'],walloffame:['Wall of Fame','· Team LTD'],vault:['LTD Vault','· Team LTD'],events:['Events','· Team LTD'],recruiting:['Recruiting CRM','· Phase 2'],aisocial:['AI Social Studio','· Phase 3']};
function nav(v){state.view=v;setNav();const c=CRUMB[v]||[v,''];document.getElementById('crumbTop').textContent=c[0];document.getElementById('crumbSub').textContent=c[1];render();document.querySelector('.main').scrollTop=0;}

function render(){
  if(state.quoteTimer){clearInterval(state.quoteTimer);state.quoteTimer=null;}
  const r=document.getElementById('root');
  const V=state.view;
  if(V==='dashboard')r.innerHTML=vDashboard();
  else if(V==='learn')r.innerHTML=vLearn();
  else if(V==='adaptive')r.innerHTML=vAdaptive();
  else if(V==='admin')r.innerHTML=vAdmin();
  else if(V==='analytics')r.innerHTML=vAnalytics();
  else if(V==='flashcards')r.innerHTML=vFlashcards();
  else if(V==='studybuddy')r.innerHTML=vStudyBuddy();
  else if(V==='associates')r.innerHTML=vAssociates();
  else if(V==='walloffame')r.innerHTML=vWallOfFame();
  else if(V==='vault')r.innerHTML=vVault();
  else if(V==='events')r.innerHTML=vEvents();
  else if(V==='recruiting')r.innerHTML=vRecruiting();
  else if(V==='aisocial')r.innerHTML=vAISocial();
  else r.innerHTML=vScaffold(V);
  wire();
}

function spineBlock(){
  const nodes=[
    {ic:'target',c:'#A5625A',h:'Recruited',p:'Prospect enters via the Recruiting CRM.'},
    {ic:'spark',c:'#6D5B72',h:'Trained',p:'Adaptive Academy path, matched to ability.'},

    {ic:'trophy',c:'#9F7D55',h:'Producing',p:'Wins flow to contests & the Wall of Fame.'},
  ];
  return `<div class="spine mt-l">
    <div class="eyebrow" style="color:var(--gold-light)">Why one platform</div>
    <h2 class="serif" style="font-size:23px;margin-top:6px;color:#fff">One agent record — from first invite to first sale</h2>
    <p style="color:var(--on-dark-2);font-size:13.5px;max-width:640px;margin-top:8px">Training isn’t a standalone app bolted on the side. On the Agency OS, the person Sare recruits, the agent she trains, and the producer they become are <b style="color:#fff">the same record</b> — so nothing is entered twice. (Policies and commissions stay in WFG’s systems; this platform is the growth engine that feeds them.)</p>
    <div class="spine-flow">${nodes.map((n,i)=>`
      <div class="snode"><div class="si" style="background:${n.c}">${svg(n.ic,18)}</div><h4>${n.h}</h4><p>${n.p}</p></div>
      ${i<nodes.length-1?`<div class="sarrow">${svg('arrow',20)}</div>`:''}`).join('')}
    </div>
  </div>`;
}
function shade(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16)-28,g=((n>>8)&255)-24,b=(n&255)-20;r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

function playerHTML(k){
  return `<div class="video" id="video">

    </div>
    <div class="concept-lbl">${k._m.name} · Concept</div>

      <div class="vctrl">
        ${svg('play',18)}<span class="tc" id="tc">0:00 / ${k.dur}</span>
        <span class="sp">Auto-chunked · ${k.beats.length} segments</span>
      </div>
    </div>
  </div>`;

function chaptersHTML(){
  let html=`<div class="chapters"><div class="ch-head"><span class="t">${COURSE.title}</span><span class="badge b-neutral">${COURSE.modules.length} modules</span></div><div class="ch-list">`;
  COURSE.modules.forEach(m=>m.chapters.forEach((c,ci)=>{
    html+=`<div class="ch"><div class="ch-t"><span class="cx" style="background:${m.color}22;color:${m.color}">${m.tag.split(' ')[1]}.${ci+1}</span>${c.name}</div>`;
    c.concepts.forEach(k=>{
      const done=doneSet.has(k.id), active=k.id===state.current;
      const icon=done?svg('check',18):(active?svg('play',18):svg('circle',18));
      html+=`<button class="concept ${done?'done':''} ${active?'active':''}" data-k="${k.id}">
        <span class="ci">${icon}</span><span>${k.t}</span>
        ${k.hasQuiz?'<span class="qflag">QUIZ</span>':''}
        <span class="dur">${k.dur}</span></button>`;
    });
    html+=`</div>`;
  }));
  return html+`</div></div>`;
}
function quizHTML(k){
  return `<div class="quiz" id="quiz">
    <div class="quiz-head"><div class="qic">${svg('quiz',19)}</div><div><h3>Checkpoint — ${k.t}</h3><p>Answer to lock in this concept and continue. ${k.quiz.length} question${k.quiz.length>1?'s':''}.</p></div></div>
    <div class="quiz-body">${k.quiz.map((q,qi)=>qBlock(q,qi)).join('')}</div>
    <div class="quiz-foot">
      <button class="btn btn-gold" id="submitQuiz">${svg('check',16)} Submit answers</button>
      <span class="muted" style="font-size:12.5px" id="quizHint">Select an answer for each question.</span>
    </div>
    <div class="result" id="quizResult" style="margin:0 24px 24px"></div>
  </div>`;
}
function qBlock(q,qi){
  return `<div class="q" data-qi="${qi}"><div class="qq"><span class="qn">${qi+1}.</span><span>${q.q}</span></div>
    ${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}"><span class="mk">${svg('check',12)}</span><span>${o}</span></div>`).join('')}
    <div class="explain"><b>Why:</b> <span class="ext"></span></div></div>`;
}
function concludeHTML(k){
  return `<div class="quiz" id="quiz"><div class="quiz-body" style="text-align:center;padding:34px">
    <div style="font-weight:700;font-size:16px;color:var(--ink)">No quiz on this concept</div>

function chunkResult(step){
  const ready=step>=PIPE.length-1;

function chunkRow(c,i,step){

}

function playToggle(){
  const segs=[...document.querySelectorAll('#segs .seg')];
  if(state.playing){stopPlay();return;}
  state.playing=true;
  const pb=document.getElementById('playBtn'); if(pb)pb.style.opacity=.15;
  let idx=segs.findIndex(s=>!s.classList.contains('done'));
  if(idx<0)idx=0;
  const k=FLAT.find(x=>x.id===state.current);
  const step=()=>{
    if(idx>=segs.length){stopPlay();onSegmentsDone(k);return;}
    const bar=segs[idx].querySelector('span');
    let w=0;
    state.playTimer=setInterval(()=>{
      w+=6; bar.style.width=Math.min(100,w)+'%';
      updTC(k,idx,w,segs.length);
      if(w>=100){clearInterval(state.playTimer);segs[idx].classList.add('done');idx++;setTimeout(step,180);}
    },26);
  };
  step();
}
function updTC(k,idx,w,total){const tc=document.getElementById('tc');if(!tc)return;const p=k.dur.split(':').map(Number);const totS=p[0]*60+p[1];const cur=Math.round(totS*((idx+w/100)/total));tc.textContent=`${Math.floor(cur/60)}:${String(cur%60).padStart(2,'0')} / ${k.dur}`;}
function stopPlay(){state.playing=false;if(state.playTimer)clearInterval(state.playTimer);const pb=document.getElementById('playBtn');if(pb)pb.style.opacity=1;}
function fillTo(i){const segs=[...document.querySelectorAll('#segs .seg')];segs.forEach((s,j)=>{s.classList.toggle('done',j<=i);s.querySelector('span').style.width=j<=i?'100%':'0';});}
function onSegmentsDone(k){stopPlay();toast('Concept watched — checkpoint unlocked');const q=document.getElementById('quiz');if(q)q.scrollIntoView({behavior:'smooth',block:'center'});}

function wireQuiz(){
  const quiz=document.getElementById('quiz'); if(!quiz)return;
  const k=FLAT.find(x=>x.id===state.current); if(!k||!k.hasQuiz)return;
  quiz.querySelectorAll('.q').forEach(qb=>{
    qb.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      if(qb.classList.contains('answered'))return;
      qb.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel'); qb.dataset.sel=o.dataset.oi;
      const hint=document.getElementById('quizHint');
      const answered=[...quiz.querySelectorAll('.q')].filter(x=>x.dataset.sel!==undefined).length;
      if(hint)hint.textContent=`${answered}/${k.quiz.length} answered.`;
    });
  });
  const sub=document.getElementById('submitQuiz');
  sub.onclick=()=>{
    const blocks=[...quiz.querySelectorAll('.q')];
    if(blocks.some(b=>b.dataset.sel===undefined)){toast('Select an answer for each question');return;}
    let correct=0;
    blocks.forEach((b,qi)=>{
      b.classList.add('answered');
      const sel=+b.dataset.sel, ans=k.quiz[qi].a;
      b.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');const oi=+o.dataset.oi;if(oi===ans)o.classList.add('correct');if(oi===sel&&sel!==ans)o.classList.add('wrong');});
      const ex=b.querySelector('.explain');ex.classList.add('show');ex.querySelector('.ext').innerHTML=k.quiz[qi].ex;
      if(sel===ans)correct++;
    });
    const pass=correct===blocks.length;
    const res=document.getElementById('quizResult');
    res.className='result show '+(pass?'pass':'retry');
    res.innerHTML=`<div class="rc">${svg(pass?'check':'refresh',24)}</div>
      <div style="flex:1"><h4>${pass?'Passed — concept complete!':`${correct}/${blocks.length} correct — review & retry`}</h4>
      <p>${pass?'This concept is marked done and the next one is unlocked on your path.':'Read the explanations above, then try again to continue.'}</p></div>
      ${pass?`<button class="btn btn-gold" id="nextConcept">${svg('arrow',16)} Next concept</button>`:`<button class="btn btn-ghost" id="retryQuiz">${svg('refresh',16)} Retry</button>`}`;
    sub.disabled=true;sub.style.opacity=.5;
    if(pass){completeConcept(true);document.getElementById('nextConcept').onclick=goNext;}
    else document.getElementById('retryQuiz').onclick=()=>render();
    res.scrollIntoView({behavior:'smooth',block:'center'});
  };
}
function completeConcept(silent){doneSet.add(state.current);if(!silent){toast('Concept marked complete');goNext();}}
function goNext(){const i=FLAT.findIndex(x=>x.id===state.current);if(i<FLAT.length-1){state.current=FLAT[i+1].id;stopPlay();render();document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});}else{toast('You’ve reached the end of the course 🎓');}}

      setTimeout(advance,delay);
    }
  };
  setTimeout(advance,700);
}

/* ---------- boot ---------- */
document.querySelectorAll('.nav-i').forEach(b=>b.onclick=()=>nav(b.dataset.view));
nav('dashboard');
</script>
